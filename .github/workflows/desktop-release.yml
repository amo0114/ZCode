name: Desktop Release

# 推送 desktop-v* tag 时在 GitHub 托管的 Windows 机器上打 NSIS 安装包，并上传到同名 GitHub Release。
# 自动更新只走自建更新源：安装包从 R2 上的 latest.yml 检查更新，不连官方更新渠道，
# 也不执行官方强制升级检查（见 docs/desktop/build-time-optional-capabilities.md）。
on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

# SSH/WSL/Docker 远端运行时（source-server-release.json + 各平台整包）自托管在 Cloudflare R2，不使用官方 CDN。
# 安装包在构建期把 https://$CDN_DOMAIN/$OSS_PATH_PREFIX 注入为远端资源下载根（见 packages/desktop/tsup.config.ts）。
env:
  CDN_DOMAIN: zcode-assets.deadloop.kdns.fr
  OSS_PATH_PREFIX: releases
  R2_BUCKET: zcode-remote-assets
  # 桌面自动更新源：electron-builder 生成的 latest.yml 与安装包放在同一目录。
  UPDATE_PATH_PREFIX: desktop/win

jobs:
  remote-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build remote assets
        run: pnpm prepare:remote-assets
      - name: Upload remote assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 不支持 AWS CLI 新版默认附加的部分校验和头。
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          release_dir=packages/desktop/mock-cdn/releases/$version
          # 客户端先读 source-server-release.json，再按其中的相对 url 下载同目录的整包；
          # 先传整包再传描述文件，避免客户端读到引用缺失整包的描述文件。
          aws s3 cp "$release_dir" "s3://$R2_BUCKET/$OSS_PATH_PREFIX/$version" \
            --recursive --exclude "*" --include "*.tar.gz" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$release_dir/source-server-release.json" \
            "s3://$R2_BUCKET/$OSS_PATH_PREFIX/$version/source-server-release.json" \
            --content-type application/json --cache-control "no-cache" --endpoint-url "$R2_ENDPOINT"
          curl -fsS -o /dev/null "https://$CDN_DOMAIN/$OSS_PATH_PREFIX/$version/source-server-release.json"
          curl -fsSI -o /dev/null "https://$CDN_DOMAIN/$OSS_PATH_PREFIX/$version/zcode-server-linux-x64.tar.gz"

  windows:
    needs: remote-assets
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # 远端资源已由 remote-assets job 构建并上传，安装包本身不依赖 mock-cdn。
      ZCODE_SKIP_REMOTE_ASSETS: "1"
    steps:
      # 仓库测试树路径较深，Windows 默认 260 字符上限会让 checkout 失败。
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 不向这一步提供 GH_TOKEN：electron-builder 检测到 token 时可能自行发布到 GitHub。
      - name: Bundle Windows installer
        env:
          ZCODE_AUTO_UPDATE: "1"
          ZCODE_UPDATE_MANIFEST_URL: https://${{ env.CDN_DOMAIN }}/${{ env.UPDATE_PATH_PREFIX }}/latest.yml
        run: pnpm bundle:desktop -- --os win --arch x64
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(packages/desktop/dist/*.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installer produced" >&2
            exit 1
          fi
          # 重跑同一个 tag 时复用已有 Release 并覆盖安装包。
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
      - name: Publish update feed to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          shopt -s nullglob
          dist=packages/desktop/dist
          if [ ! -f "$dist/latest.yml" ]; then
            echo "electron-builder did not produce latest.yml" >&2
            exit 1
          fi
          # 先传安装包与差分 blockmap，最后传 latest.yml，避免客户端读到引用缺失安装包的 manifest。
          for file in "$dist"/*.exe "$dist"/*.exe.blockmap; do
            aws s3 cp "$file" "s3://$R2_BUCKET/$UPDATE_PATH_PREFIX/$(basename "$file")" \
              --endpoint-url "$R2_ENDPOINT"
          done
          # latest.yml 中的相对 url 由客户端按同目录解析；发布前逐个确认可下载，避免文件名不一致导致更新 404。
          sed -n 's/^ *- url: *//p' "$dist/latest.yml" | while read -r name; do
            encoded=$(node -e 'process.stdout.write(encodeURI(process.argv[1]))' "$name")
            curl -fsSI -o /dev/null "https://$CDN_DOMAIN/$UPDATE_PATH_PREFIX/$encoded"
          done
          aws s3 cp "$dist/latest.yml" "s3://$R2_BUCKET/$UPDATE_PATH_PREFIX/latest.yml" \
            --content-type "text/yaml" --cache-control "no-cache" --endpoint-url "$R2_ENDPOINT"
          curl -fsS -o /dev/null "https://$CDN_DOMAIN/$UPDATE_PATH_PREFIX/latest.yml"
